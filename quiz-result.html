<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - SkillSync</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">SkillSync</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="quiz.html" class="btn-primary">Take Another Quiz</a>
            </div>
            <button class="hamburger" aria-label="Menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Results Section -->
    <section class="results-section">
        <div class="container">
            <div class="results-container">
                <div class="score-reveal">
                    <div class="circular-progress">
                        <svg width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="stop-color:#6C63FF"/>
                                    <stop offset="100%" style="stop-color:#00D9FF"/>
                                </linearGradient>
                            </defs>
                            <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                            <circle class="circle-progress" id="progressCircle" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="score-text">
                            <span id="scorePercent">0%</span>
                        </div>
                    </div>
                    <h2 class="result-message" id="resultMessage">Great Job!</h2>
                </div>

                <div class="score-details">
                    <div class="detail-card">
                        <span class="detail-label">Correct Answers</span>
                        <span class="detail-value" id="correctAnswers">0/10</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Time Taken</span>
                        <span class="detail-value" id="timeTaken">0:00</span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Domain</span>
                        <span class="detail-value" id="domainName">-</span>
                    </div>
                </div>

                <div class="results-actions">
                    <a href="quiz.html" class="btn-primary">Take Another Quiz</a>
                    <a href="dashboard.html" class="btn-secondary">Back to Dashboard</a>
                </div>

                <div class="share-section">
                    <p>Share your results:</p>
                    <div class="share-buttons">
                        <button class="share-btn" onclick="shareResult('twitter')">Twitter</button>
                        <button class="share-btn" onclick="shareResult('facebook')">Facebook</button>
                        <button class="share-btn" onclick="copyLink()">Copy Link</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 SkillSync. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // Get results from sessionStorage
        const results = JSON.parse(localStorage.getItem('quizResults')) || [];
        const lastResult = results.length > 0 ? results[results.length - 1] : null;

        if (!lastResult) {
            window.location.href = 'quiz.html';
        }

        const percent = lastResult.percent || 0;
        
        document.getElementById('scorePercent').textContent = percent + '%';
        document.getElementById('correctAnswers').textContent = `${lastResult.score}/${lastResult.total}`;
        
        const minutes = Math.floor(lastResult.time / 60);
        const seconds = lastResult.time % 60;
        document.getElementById('timeTaken').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        
        const domainNames = {
            'coding': 'Coding',
            'design': 'Design',
            'communication': 'Communication'
        };
        document.getElementById('domainName').textContent = domainNames[lastResult.domain] || 'Unknown';

        const messages = {
            excellent: 'Excellent! Outstanding Performance!',
            good: 'Great Job! Well Done!',
            average: 'Good Effort! Keep Practicing!',
            low: 'Keep Learning! You Can Do Better!'
        };

        let message;
        if (percent >= 90) message = messages.excellent;
        else if (percent >= 70) message = messages.good;
        else if (percent >= 50) message = messages.average;
        else message = messages.low;
        
        document.getElementById('resultMessage').textContent = message;

        const circle = document.getElementById('progressCircle');
        const circumference = 2 * Math.PI * 90;
        const offset = circumference - (percent / 100) * circumference;
        
        setTimeout(() => {
            circle.style.strokeDashoffset = offset;
        }, 100);

        function shareResult(platform) {
            const text = `I scored ${percent}% on the ${domainNames[lastResult.domain]} quiz! @SkillSync`;
            
            if (platform === 'twitter') {
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
            } else if (platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }

        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
